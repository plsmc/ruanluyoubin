name: Build NN6000V2 firmware

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Firmware config name without .config'
        required: true
        default: link_nn6000v2_immwrt
      build_mode:
        description: 'Build mode'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip wget file time ca-certificates xsltproc zstd \
            ccache git

      - name: Configure git and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_UNSAFE_CONFIGURE: '1'
        run: |
          git config --global advice.detachedHead false
          git config --global protocol.version 2
          nn6000v2/scripts/build.sh "${{ inputs.config }}" "${{ inputs.build_mode == 'debug' && 'debug' || '' }}"

      - name: Collect firmware and logs
        if: always()
        run: |
          mkdir -p artifacts
          for dir in firmware action_build/bin/targets; do
            [ -d "$dir" ] || continue
            find "$dir" -type f \( \
              -name '*-factory.bin' -o -name '*-sysupgrade.bin' -o \
              -name '*_nowifi.bin' -o -name '*.manifest' \
            \) -exec cp -f {} artifacts/ \;
          done
          find artifacts -maxdepth 1 -type f -print | sort

      - name: Upload firmware artifact
        if: always() && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: nn6000v2-firmware-${{ inputs.config }}-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release
        if: success() && inputs.build_mode == 'release' && hashFiles('artifacts/**') != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nn6000v2-${{ github.run_number }}
          name: "NN6000V2 firmware #${{ github.run_number }}"
          body: |
            Automated firmware build from workflow run ${{ github.run_number }}.
          files: artifacts/*
          make_latest: true
