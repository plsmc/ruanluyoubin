<%+header%>
<h2><%:Radar 程序更新%></h2>
<form method="post">
  <input type="hidden" name="token" value="<%=token%>" />
  <label><%:更新地址（目录，需包含 latest.json）%></label>
  <input type="text" name="update_url" value="<%=luci.xml.pcdata(update_url or '')%>" style="width: min(600px, 100%);" placeholder="https://example.com/radar" />
  <input class="cbi-button cbi-button-save" type="submit" name="save" value="<%:保存地址%>" />
</form>
<p><%:从已保存的地址检查并更新 radar-raw1-sender。%></p>
<button class="cbi-button cbi-button-apply" type="button" id="radar-update-start"><%:立即更新%></button>
<div id="radar-update-progress" style="display:none;margin-top:1em;max-width:600px">
  <progress id="radar-update-bar" value="0" max="100" style="width:100%;height:1.2em"></progress>
  <div style="display:flex;justify-content:space-between;margin-top:.35em">
    <span id="radar-update-message"></span>
    <span id="radar-update-percent">0%</span>
  </div>
</div>
<pre id="radar-update-log" style="display:none;margin-top:1em;white-space:pre-wrap"></pre>
<% if result then %>
<pre style="margin-top:1em;white-space:pre-wrap"><%=luci.xml.pcdata(result)%></pre>
<% end %>
<script type="text/javascript">
(function() {
  'use strict';
  var button = document.getElementById('radar-update-start');
  var progress = document.getElementById('radar-update-progress');
  var bar = document.getElementById('radar-update-bar');
  var message = document.getElementById('radar-update-message');
  var percent = document.getElementById('radar-update-percent');
  var log = document.getElementById('radar-update-log');
  var base = window.location.pathname.replace(/\/$/, '');
  var polling = false;

  function formatBytes(value) {
    if (value < 1024) return value + ' B';
    if (value < 1048576) return (value / 1024).toFixed(1) + ' KB';
    return (value / 1048576).toFixed(1) + ' MB';
  }

  function request(method, path, body, callback) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, base + path, true);
    if (method === 'POST') xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      try {
        callback(xhr.status >= 200 && xhr.status < 300 ? null : new Error('HTTP ' + xhr.status), JSON.parse(xhr.responseText));
      } catch (error) {
        callback(error);
      }
    };
    xhr.send(body || null);
  }

  function showStatus(data) {
    var value = Math.max(0, Math.min(100, Number(data.percent) || 0));
    progress.style.display = '';
    bar.value = value;
    percent.textContent = value + '%';
    message.textContent = data.message || '';
    if (data.state === 'downloading' && data.total > 0)
      message.textContent += ' (' + formatBytes(data.downloaded) + ' / ' + formatBytes(data.total) + ')';
    log.textContent = data.log || '';
    log.style.display = data.log ? '' : 'none';
  }

  function poll() {
    request('GET', '/status?_=' + Date.now(), null, function(error, data) {
      if (error || !data) {
        showStatus({ state: 'failed', percent: 0, message: '<%:无法读取更新状态%>' });
        button.disabled = false;
        polling = false;
        return;
      }
      showStatus(data);
      if (data.state === 'done' || data.state === 'failed' || data.state === 'idle') {
        button.disabled = false;
        polling = false;
      } else {
        window.setTimeout(poll, 500);
      }
    });
  }

  button.addEventListener('click', function() {
    button.disabled = true;
    progress.style.display = '';
    log.style.display = 'none';
    showStatus({ state: 'starting', percent: 1, message: '<%:正在启动更新任务%>' });
    request('POST', '/start', 'token=' + encodeURIComponent('<%=token%>'), function(error, data) {
      if (error || !data || !data.ok) {
        showStatus({ state: 'failed', percent: 0, message: data && data.error ? data.error : '<%:无法启动更新任务%>' });
        button.disabled = false;
        return;
      }
      polling = true;
      window.setTimeout(poll, 250);
    });
  });

  request('GET', '/status?_=' + Date.now(), null, function(error, data) {
    if (!error && data && data.state !== 'idle') showStatus(data);
  });
})();
</script>
<%+footer%>
